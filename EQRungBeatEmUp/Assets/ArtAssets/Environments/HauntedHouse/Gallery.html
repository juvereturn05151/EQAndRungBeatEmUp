<!doctype html><html><meta charset="utf-8"><title>Haunted stages gallery</title><style>body{background:#17131c;color:#eee;font:16px system-ui;margin:28px}img{display:block;image-rendering:pixelated;width:min(100%,1080px);margin-top:16px}select,button{font:inherit;padding:10px;background:#342738;color:white;border:1px solid #ac6262}a{color:#ffa7a7;margin:12px}p{max-width:900px}</style><h1>Haunted-house stage art</h1><select id="stage"></select><select id="layer"><option>Preview</option><option>Background</option><option>Floor</option></select><img id="art"><p id="links"></p><p>Eight stages in sequence. Backgrounds are720×160, floors720×240,100PPU,40/60 composition. Scenery plates have no colliders or gameplay logic. These are fixed room segments; edges are not guaranteed to tile seamlessly.</p><script>const stages=[{"id":"Stage01_EntranceGate","name":"Entrance Gate"},{"id":"Stage02_BloodSheetCorridor","name":"Blood Sheet Corridor"},{"id":"Stage03_FakeMorgue","name":"Fake Morgue"},{"id":"Stage04_ServiceCorridor","name":"Service Corridor & Stair"},{"id":"Stage05_HauntedMaze","name":"Haunted Maze"},{"id":"Stage06_RecoveryShrine","name":"Recovery Shrine / Safe Room"},{"id":"Stage07_WhiteGhostBossChamber","name":"White Ghost Boss Chamber"},{"id":"Stage08_EscapeLane","name":"Escape Lane (Exit)"}];const s=document.getElementById('stage'),l=document.getElementById('layer');for(const j of stages){const o=document.createElement('option');o.textContent=j.name;s.append(o);}function show(){const j=stages[s.selectedIndex],kind=l.value;document.getElementById('art').src=j.id+'/'+(kind==='Preview'?'':kind+'/')+j.id+'_'+kind+'.png';document.getElementById('links').innerHTML=['Background','Floor'].map(k=>'<a href="'+j.id+'/'+k+'/'+j.id+'_'+k+'.png">'+k+' PNG</a>').join('');}s.onchange=l.onchange=show;show();</script></html>
